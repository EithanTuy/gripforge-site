<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You’re on the list — GripForge</title>
<meta name="description" content="You’re on the list for GripForge Frameboard updates.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2EDE3">
<link rel="icon" type="image/png" href="/assets/gripforge-mark-dark.png">

<style>
  :root{
    color-scheme:light;
    --ink:#14130F;
    --paper:#F2EDE3;
    --muted:rgba(20,19,16,.68);
    --faint:rgba(20,19,16,.13);
    --wood:#8A5C2C;
  }

  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;background:var(--paper)}

  body{
    margin:0;
    min-height:100vh;
    min-height:100svh;
    max-width:1320px;
    margin-inline:auto;
    display:flex;
    flex-direction:column;
    padding:clamp(1.4rem,4vw,3.25rem);
    background:var(--paper);
    color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  header{padding-bottom:clamp(1rem,2.4vw,1.5rem)}
  header img{display:block;height:clamp(21px,2.5vw,30px);width:auto}
  .rule{height:1px;background:var(--faint);border:0;margin:0}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:clamp(2rem,6vh,5rem) 0;
  }

  h1{
    font-size:clamp(2rem,5.5vw,3.5rem);
    font-weight:600;
    line-height:1.05;
    letter-spacing:-.025em;
    margin:0;
    max-width:16ch;
  }

  p{
    margin:clamp(1.2rem,2.5vw,1.6rem) 0 0;
    max-width:42ch;
    font-size:clamp(1rem,1.35vw,1.09rem);
    line-height:1.62;
    color:var(--muted);
  }

  a.back{
    display:inline-block;
    margin-top:clamp(1.8rem,3.5vw,2.4rem);
    font-size:.74rem;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--wood);
    text-decoration:none;
    border-bottom:1px solid rgba(138,92,44,.4);
    padding-bottom:.3rem;
  }

  a.back:hover{color:var(--ink);border-bottom-color:var(--ink)}

  footer{
    padding-top:clamp(1rem,2.4vw,1.5rem);
    display:flex;
    flex-wrap:wrap;
    gap:.6rem 1.5rem;
    justify-content:space-between;
    font-size:.68rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
  }
</style>
</head>

<body>

  <header>
    <img src="/assets/gripforge-logo-dark.png" width="760" height="110" alt="GripForge">
  </header>

  <hr class="rule">

  <main>
    <h1>You&rsquo;re on the list.</h1>
    <p>We&rsquo;ll email you when Frameboard launches on Kickstarter, and when there&rsquo;s something worth showing before then. Nothing else.</p>
    <a class="back" href="/">Back to gripforge.us</a>
  </main>

  <hr class="rule">

  <footer>
    <span>gripforge.us</span>
    <span>&copy; 2026 GripForge</span>
  </footer>

</body>
</html>
